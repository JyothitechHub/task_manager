<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Task Manager{% endblock %}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
    nav {
      background: #1a73e8; color: white;
      padding: 14px 30px;
      display: flex; justify-content: space-between; align-items: center;
    }
    nav .logo { font-size: 1.3rem; font-weight: 700; }
    nav a { color: white; text-decoration: none; margin-left: 20px; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 960px; margin: 30px auto; padding: 0 20px; }
    .messages { margin-bottom: 20px; }
    .messages li {
      list-style: none; padding: 12px 18px; border-radius: 8px; margin-bottom: 8px;
    }
    .messages .success { background: #d4edda; color: #155724; }
    .messages .error   { background: #f8d7da; color: #721c24; }
    .card {
      background: white; border-radius: 12px;
      padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .card h2 { margin-bottom: 22px; font-size: 1.4rem; color: #1a73e8; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 0.95rem; font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none; border-color: #1a73e8;
    }
    .btn {
      padding: 10px 24px; border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-block;
    }
    .btn-primary   { background: #1a73e8; color: white; }
    .btn-success   { background: #28a745; color: white; }
    .btn-warning   { background: #ffc107; color: #333; }
    .btn-danger    { background: #dc3545; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-sm { padding: 6px 14px; font-size: 0.82rem; }

  </style>
  
  {% block extra_css %}{% endblock %}
  
  
</head>
<body>

{% if user.is_authenticated %}
<nav>
  <div class="logo">✅ Task Manager</div>
  <div>
    <span>👋 {{ user.username }}</span>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'add_task' %}">+ Add Task</a>
    <a href="{% url 'logout' %}">Logout</a>
  </div>
</nav>
{% endif %}

<div class="container">
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
